<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Looper Pedal</title>
    <style>
        body {
            background-color: #24292e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #e1e4e8;
        }

        #pedal-case {
            width: 320px;
            background-color: #d1d5da;
            border: 3px solid #444;
            border-radius: 30px;
            padding: 25px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 15px 0 #959da5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .brand-label {
            font-size: 18px;
            font-weight: 200;
            color: #24292e;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .version-label {
            font-size: 10px;
            color: #586069;
            margin-top: -15px;
            margin-bottom: 10px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
        }

        .small-pedal-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #24292e;
            background: #ffffff;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #24292e;
            cursor: pointer;
            text-align: center;
        }

        .small-pedal-btn:active {
            background: #e1e4e8;
            transform: translateY(2px);
        }

        #reset-btn {
            color: #d73a49;
        }

        .slider-box {
            width: 100%;
            background: #fafbfc;
            border: 2px solid #24292e;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slider-label {
            font-size: 12px;
            color: #24292e;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type=range] {
            width: 100%;
            margin: 10px 0;
        }

        #main-switch {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 8px solid #6a737d; 
            background: #f6f8fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #959da5;
        }

        #main-switch:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #959da5;
        }

        #status-text {
            font-size: 16px;
            font-weight: bold;
            color: #24292e;
        }

        #sub-status {
            font-size: 10px;
            color: #586069;
            margin-top: 5px;
        }

        .led-light {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #444;
            margin-bottom: 10px;
            border: 1px solid #000;
        }

        .outline-orange { border-color: #f66a0a !important; }
        .outline-red { border-color: #d73a49 !important; }
        .outline-green { border-color: #28a745 !important; }
        .outline-empty { border-color: #6a737d !important; }

        #init-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(209, 213, 218, 0.95);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 30px;
        }

        .power-btn {
            padding: 20px 40px;
            background: #d73a49;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 0 #8a1d23;
        }
    </style>
</head>
<body>

<div id="pedal-case">
    <div id="init-overlay">
        <button class="power-btn" onclick="startPedal()">START / ALLOW MIC</button>
    </div>

    <div class="brand-label">360 Looper Pedal</div>
    <div class="version-label">Vibe coded by Jeremiah Keller v0.004</div>

    <div class="led-light" id="beat-led"></div>

    <div class="control-row">
        <div id="tap-btn" class="small-pedal-btn">TAP TEMPO</div>
        <div id="reset-btn" class="small-pedal-btn" onclick="location.reload()">RESET ALL</div>
    </div>

    <div class="slider-box">
        <div class="slider-label">BPM: <span id="bpm-val">90</span></div>
        <input type="range" id="bpm-slider" min="20" max="200" value="90">
    </div>

    <div id="main-switch" class="outline-empty">
        <div id="status-text">RECORD</div>
        <div id="sub-status">READY</div>
    </div>

    <div class="control-row">
        <div class="slider-box" style="flex:1">
            <div class="slider-label">CLICK</div>
            <input type="range" id="click-vol" min="0" max="1" step="0.1" value="0.5">
        </div>
        <div class="slider-box" style="flex:1">
            <div class="slider-label">LOOP</div>
            <input type="range" id="loop-vol" min="0" max="1" step="0.1" value="0.8">
        </div>
    </div>
</div>

<script>
    let audioCtx;
    let bpm = 90;
    let isClicking = false;
    let nextBeatTime = 0;
    let currentBeat = 0;
    let tapTimes = [];
    
    let looperState = 'EMPTY'; 
    let countdownBeats = 0;
    let recordedOnce = false;
    
    let mediaRecorder;
    let audioChunks = [];
    let loopBuffer;
    let loopSource;
    let currentMicStream = null;

    const mainBtn = document.getElementById('main-switch');
    const statusText = document.getElementById('status-text');
    const subStatus = document.getElementById('sub-status');
    const beatLed = document.getElementById('beat-led');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmVal = document.getElementById('bpm-val');
    const clickVolSlider = document.getElementById('click-vol');

    async function startPedal() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        
        try {
            // Request permission, then immediately turn off the mic to free up iOS audio
            const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            tempStream.getTracks().forEach(track => track.stop());
            
            document.getElementById('init-overlay').style.display = 'none';
            
            // Unlock audio context with a silent beep
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);

            if (!isClicking) startMetronome();
        } catch (err) {
            alert("Microphone access is required for the looper to work.");
        }
    }

    function startMetronome() {
        isClicking = true;
        nextBeatTime = audioCtx.currentTime + 0.1;
        scheduler();
    }

    function scheduler() {
        while (nextBeatTime < audioCtx.currentTime + 0.1) {
            scheduleBeat(currentBeat, nextBeatTime);
            advanceBeat();
        }
        setTimeout(scheduler, 25);
    }

    function advanceBeat() {
        const secondsPerBeat = 60.0 / bpm;
        nextBeatTime += secondsPerBeat;
        currentBeat = (currentBeat + 1) % 4;
    }

    function scheduleBeat(beat, time) {
        const vol = clickVolSlider.value;
        if (vol > 0) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = (beat === 0) ? 1000 : 500;
            gain.gain.value = vol;
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + 0.1);
        }

        setTimeout(() => {
            beatLed.style.background = (beat === 0) ? '#d73a49' : '#0366d6';
            setTimeout(() => beatLed.style.background = '#444', 100);
            handleLogic(beat);
        }, (time - audioCtx.currentTime) * 1000);
    }

    function handleLogic(beat) {
        if (beat === 0) {
            if (looperState === 'ARMING') {
                looperState = 'COUNTING';
                countdownBeats = 4;
                updateUI();
            } else if (looperState === 'COUNTING') {
                countdownBeats -= 4;
                if (countdownBeats <= 0) {
                    clickVolSlider.value = 0; 
                    startRecording();
                }
            } else if (looperState === 'RECORDING') {
                stopRecording();
            } else if (looperState === 'PLAYING') {
                playLoop();
            }
        }
        
        if (looperState === 'COUNTING') {
            subStatus.innerText = "STARTING IN " + (4 - beat);
        }
    }

    mainBtn.addEventListener('click', () => {
        if (looperState === 'EMPTY' && !recordedOnce) {
            looperState = 'ARMING';
            updateUI();
        } else if (looperState === 'PLAYING') {
            if (loopSource) loopSource.stop();
            looperState = 'STOPPED';
            updateUI();
        } else if (looperState === 'STOPPED') {
            looperState = 'PLAYING';
            updateUI();
        }
    });

    document.getElementById('tap-btn').addEventListener('click', () => {
        const now = performance.now();
        tapTimes.push(now);
        if (tapTimes.length > 4) tapTimes.shift();
        if (tapTimes.length >= 2) {
            const intervals = [];
            for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
            const avg = intervals.reduce((a, b) => a + b) / intervals.length;
            bpm = Math.round(60000 / avg);
            if (bpm < 20) bpm = 20;
            if (bpm > 200) bpm = 200;
            bpmSlider.value = bpm;
            bpmVal.innerText = bpm;
        }
    });

    bpmSlider.addEventListener('input', (e) => {
        bpm = parseInt(e.target.value);
        bpmVal.innerText = bpm;
    });

    function updateUI() {
        mainBtn.className = '';
        subStatus.innerText = "";

        switch(looperState) {
            case 'EMPTY':
                mainBtn.classList.add('outline-empty');
                statusText.innerText = "RECORD";
                subStatus.innerText = "READY";
                break;
            case 'ARMING':
                mainBtn.classList.add('outline-orange');
                statusText.innerText = "WAITING";
                subStatus.innerText = "FOR BEAT 1";
                break;
            case 'COUNTING':
                mainBtn.classList.add('outline-orange');
                statusText.innerText = "GET READY";
                break;
            case 'RECORDING':
                mainBtn.classList.add('outline-red');
                statusText.innerText = "RECORDING";
                subStatus.innerText = "PLAY NOW";
                break;
            case 'PLAYING':
                mainBtn.classList.add('outline-green');
                statusText.innerText = "PLAYING";
                subStatus.innerText = "TAP TO PAUSE";
                break;
            case 'STOPPED':
                mainBtn.classList.add('outline-red'); 
                statusText.innerText = "PAUSED";
                subStatus.innerText = "TAP TO PLAY";
                break;
        }
    }

    async function startRecording() {
        looperState = 'RECORDING';
        recordedOnce = true;
        updateUI();
        audioChunks = [];
        
        try {
            currentMicStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(currentMicStream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.start();
        } catch (e) {
            alert("Could not start microphone for recording.");
        }
    }

    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
            
            mediaRecorder.onstop = async () => {
                // Instantly kill the microphone track to release iOS audio suppression
                if (currentMicStream) {
                    currentMicStream.getTracks().forEach(track => track.stop());
                }

                try {
                    const blob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' }); 
                    const buffer = await blob.arrayBuffer();
                    loopBuffer = await audioCtx.decodeAudioData(buffer);
                    looperState = 'PLAYING';
                    updateUI();
                    playLoop();
                } catch (e) {
                    alert("Audio processing failed. Please hit Reset All and try again.");
                }
            };
        }
    }

    function playLoop() {
        if (!loopBuffer || looperState !== 'PLAYING') return;
        if (loopSource) loopSource.stop();
        
        loopSource = audioCtx.createBufferSource();
        loopSource.buffer = loopBuffer;
        const gain = audioCtx.createGain();
        gain.gain.value = document.getElementById('loop-vol').value;
        
        loopSource.connect(gain);
        gain.connect(audioCtx.destination);
        loopSource.start(0);
    }
</script>

</body>
</html>
