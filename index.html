<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Cache Busting Meta Tags to ensure Safari always loads the newest GitHub upload -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>360 Looper Pedal v0.014</title>
    <style>
        body {
            background-color: #24292e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #e1e4e8;
            padding: 20px 0;
        }

        #pedal-case {
            width: 350px;
            background-color: #d1d5da;
            border: 3px solid #444;
            border-radius: 30px;
            padding: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 15px 0 #959da5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .brand-label {
            font-size: 16px;
            font-weight: 200;
            color: #24292e;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #display-screen {
            width: 100%;
            height: 140px;
            background: #1b1f23;
            border: 2px solid #444;
            border-radius: 10px;
            position: relative;
            touch-action: none;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 30px;
            margin-left: -15px;
            z-index: 10;
        }

        .marker-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
        }

        #intro-marker .marker-line { background: #fafbfc; box-shadow: 0 0 5px #fff; }
        #start-marker .marker-line { background: #0366d6; box-shadow: 0 0 5px #0366d6; }
        #end-marker .marker-line { background: #d73a49; box-shadow: 0 0 5px #d73a49; }

        #playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ffd33d;
            box-shadow: 0 0 8px #ffd33d;
            z-index: 5;
            left: 0%;
            display: none;
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .grid-controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .pedal-btn {
            padding: 15px 8px;
            border: 2px solid #24292e;
            background: #ffffff;
            border-radius: 10px;
            font-size: 11px;
            color: #24292e;
            cursor: pointer;
            box-shadow: 0 4px 0 #959da5;
            text-align: center;
            text-transform: uppercase;
        }

        .pedal-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #959da5;
        }

        #power-btn { width: 100%; font-weight: bold; }
        .mic-off { background: #ffd33d !important; }
        .mic-on { background: #28a745 !important; color: white !important; }
        
        #rec-btn {
            border: 2px solid #d73a49;
            color: #d73a49;
            font-weight: bold;
            box-shadow: 0 4px 0 #a02a36;
        }
        
        #rec-btn:active {
            box-shadow: 0 2px 0 #a02a36;
        }

        .rec-active { 
            background: #d73a49 !important; 
            color: white !important; 
            box-shadow: 0 4px 0 #a02a36 !important;
        }

        .slider-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            background: #fafbfc;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #959da5;
            box-sizing: border-box;
            gap: 15px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .label-container {
            display: flex;
            flex-direction: column;
            width: 75px;
        }

        label {
            font-size: 11px;
            color: #586069;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .val-display {
            font-size: 10px;
            color: #0366d6;
            font-weight: bold;
        }

        input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            width: 100%;
            height: 20px;
            background: #e1e4e8;
            border-radius: 10px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #0366d6;
            cursor: pointer;
            border: 2px solid #24292e;
        }

        #timer {
            font-family: monospace;
            font-size: 18px;
            color: #24292e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>

<div id="pedal-case">
    <div class="brand-label">360 LOOPER v0.014</div>
    
    <button id="power-btn" class="pedal-btn mic-off">1. INITIALIZE MIC</button>
    
    <div class="controls">
        <button id="rec-btn" class="pedal-btn" style="flex:1;">RECORD</button>
        <div id="timer">00:00</div>
    </div>

    <div id="display-screen">
        <canvas id="waveform-canvas"></canvas>
        <div id="playhead"></div>
        <div id="intro-marker" class="marker" style="left: 5%;"><div class="marker-line"></div></div>
        <div id="start-marker" class="marker" style="left: 30%;"><div class="marker-line"></div></div>
        <div id="end-marker" class="marker" style="left: 80%;"><div class="marker-line"></div></div>
    </div>

    <div class="grid-controls">
        <button id="stop-btn" class="pedal-btn" style="color: #d73a49; font-weight: bold;">STOP</button>
        <button id="play-intro-btn" class="pedal-btn" style="background: #e1e4e8; font-weight: bold;">PLAY INTRO</button>
        <button id="play-loop-btn" class="pedal-btn" style="background: #c8e1ff; font-weight: bold;">PLAY LOOP</button>
    </div>

    <div class="slider-group">
        <div class="slider-row">
            <div class="label-container">
                <label>VOL</label>
                <span class="val-display" id="vol-val">100%</span>
            </div>
            <input type="range" id="vol-slider" min="0" max="5" step="0.1" value="1.0">
        </div>
        <div class="slider-row">
            <div class="label-container">
                <label>GAIN</label>
                <span class="val-display" id="gain-val">0%</span>
            </div>
            <input type="range" id="gain-slider" min="0" max="100" step="1" value="0">
        </div>
        <div class="slider-row">
            <div class="label-container">
                <label>PITCH</label>
                <span class="val-display" id="pitch-val">100%</span>
            </div>
            <input type="range" id="pitch-slider" min="0.5" max="2.0" step="0.05" value="1.0">
        </div>
        <div class="slider-row">
            <div class="label-container">
                <label>LOW PASS</label>
            </div>
            <input type="range" id="lp-slider" min="100" max="20000" step="100" value="20000">
        </div>
        <div class="slider-row">
            <div class="label-container">
                <label>HIGH PASS</label>
            </div>
            <input type="range" id="hp-slider" min="20" max="5000" step="50" value="20">
        </div>
    </div>

    <button id="reset-btn" class="pedal-btn" style="width:100%; color:#d73a49; font-weight: bold;">RESET ALL</button>
</div>

<script>
    /* 
        ========================================
        STATE & GLOBAL VARIABLES
        ========================================
    */
    let audioCtx, micStream, recorder, audioChunks = [], audioBuffer, sourceNode, analyser;
    let isRecording = false, isPlaying = false, isMicActive = false, hasRecorded = false;
    let startTime, timerInterval, animationId, playheadAnimId;
    let playbackStartTime = 0, bufferOffset = 0;
    
    // Web Audio API effect nodes
    let lowPassNode, highPassNode, gainNode, distortionNode;
    let liveAmplitudes = [];

    // UI Elements
    const canvas = document.getElementById('waveform-canvas');
    const ctx = canvas.getContext('2d');
    const playhead = document.getElementById('playhead');
    const powerBtn = document.getElementById('power-btn');
    const recBtn = document.getElementById('rec-btn');
    const timerDisplay = document.getElementById('timer');

    // Default marker positions (percentages of total duration)
    let markers = { intro: 0.05, start: 0.30, end: 0.80 };
    const MAX_REC_SECONDS = 60;

    /* 
        ========================================
        AUDIO INITIALIZATION & ROUTING
        ========================================
    */
    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create and configure filter nodes
            lowPassNode = audioCtx.createBiquadFilter();
            lowPassNode.type = 'lowpass';
            lowPassNode.Q.value = 5; 
            
            highPassNode = audioCtx.createBiquadFilter();
            highPassNode.type = 'highpass';
            highPassNode.Q.value = 5; 

            // Create distortion node for the Gain slider
            distortionNode = audioCtx.createWaveShaper();
            distortionNode.oversample = '4x';
            
            gainNode = audioCtx.createGain();
            
            // Route audio: Highpass -> Lowpass -> Distortion -> Gain -> Destination
            highPassNode.connect(lowPassNode);
            lowPassNode.connect(distortionNode);
            distortionNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            updateFilters();
        }
    }

    // Mathematical curve generator for the Gain/Distortion effect
    function makeDistortionCurve(amount) {
        if (amount === 0) return null; // Null bypasses the waveshaper perfectly clean
        let k = amount;
        let n_samples = 44100;
        let curve = new Float32Array(n_samples);
        let deg = Math.PI / 180;
        for (let i = 0; i < n_samples; ++i) {
            let x = i * 2 / n_samples - 1;
            curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }

    // Canvas scaling for high-resolution retina screens
    function resize() {
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = canvas.offsetHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resize);
    resize();

    /* 
        ========================================
        UI SLIDER CONTROLS
        ========================================
    */
    // Helper to detect double taps on mobile
    function addDoubleTap(el, callback) {
        let lastTap = 0;
        el.addEventListener('touchend', (e) => {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            if (tapLength < 400 && tapLength > 0) {
                callback(e);
                e.preventDefault();
            }
            lastTap = currentTime;
        });
        el.addEventListener('dblclick', callback);
    }

    const volSlider = document.getElementById('vol-slider');
    const gainSlider = document.getElementById('gain-slider');
    const pitchSlider = document.getElementById('pitch-slider');
    const lpSlider = document.getElementById('lp-slider');
    const hpSlider = document.getElementById('hp-slider');

    volSlider.addEventListener('input', updateFilters);
    gainSlider.addEventListener('input', updateFilters);
    pitchSlider.addEventListener('input', updateFilters);
    lpSlider.addEventListener('input', updateFilters);
    hpSlider.addEventListener('input', updateFilters);

    // Double tap snaps values back to default
    addDoubleTap(volSlider, () => { volSlider.value = 1.0; updateFilters(); });
    addDoubleTap(gainSlider, () => { gainSlider.value = 0; updateFilters(); });
    addDoubleTap(pitchSlider, () => { pitchSlider.value = 1.0; updateFilters(); });

    function updateFilters() {
        if (!audioCtx) return;
        let volVal = volSlider.value;
        let gainVal = parseInt(gainSlider.value);
        let pitchVal = pitchSlider.value;
        
        // Update visual text displays
        document.getElementById('vol-val').innerText = Math.round(volVal * 100) + '%';
        document.getElementById('gain-val').innerText = gainVal + '%';
        document.getElementById('pitch-val').innerText = Math.round(pitchVal * 100) + '%';

        // Apply slider values to Web Audio nodes
        gainNode.gain.value = volVal;
        distortionNode.curve = makeDistortionCurve(gainVal);
        lowPassNode.frequency.value = lpSlider.value;
        highPassNode.frequency.value = hpSlider.value;
        
        if (sourceNode && isPlaying) {
            sourceNode.playbackRate.value = pitchVal;
        }
    }

    /* 
        ========================================
        MICROPHONE HANDLING
        ========================================
    */
    powerBtn.addEventListener('click', async () => {
        initAudioContext();
        if (!isMicActive) {
            try {
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                
                // Request raw microphone access
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                isMicActive = true;
                powerBtn.innerText = "MIC ON - TAP TO RELEASE";
                powerBtn.className = "pedal-btn mic-on";
                
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(micStream);
                source.connect(analyser);
            } catch (e) {
                alert("Mic access denied. Please check Safari settings.");
            }
        } else {
            releaseMicSimple();
        }
    });

    function releaseMicSimple() {
        if (micStream) {
            micStream.getTracks().forEach(t => t.stop());
            micStream = null;
        }
        isMicActive = false;
        powerBtn.innerText = "MIC RELEASED - TAP TO RE-ARM";
        powerBtn.className = "pedal-btn mic-off";
        cancelAnimationFrame(animationId);
    }

    /* 
        ========================================
        WAVEFORM VISUALIZATION
        ========================================
    */
    function drawLiveWaveform() {
        if (!isRecording || !analyser) return;
        
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteTimeDomainData(dataArray);

        let maxAmp = 0;
        for (let i = 0; i < bufferLength; i++) {
            let amp = Math.abs(dataArray[i] - 128);
            if (amp > maxAmp) maxAmp = amp;
        }
        
        liveAmplitudes.push(maxAmp);

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#d73a49';
        
        const ampScale = canvas.height / 128;
        const widthPerSecond = canvas.width / MAX_REC_SECONDS;
        const totalSamplesExpected = MAX_REC_SECONDS * 60; 
        const sampleWidth = canvas.width / totalSamplesExpected;

        for (let i = 0; i < liveAmplitudes.length; i++) {
            let h = liveAmplitudes[i] * ampScale;
            if (h > canvas.height) h = canvas.height;
            if (h < 2) h = 2; 
            
            let x = i * sampleWidth;
            let y = (canvas.height - h) / 2;
            ctx.fillRect(x, y, Math.ceil(sampleWidth), h);
        }
        
        animationId = requestAnimationFrame(drawLiveWaveform);
    }

    function drawStaticWaveform() {
        const data = audioBuffer.getChannelData(0);
        const step = Math.ceil(data.length / canvas.width);
        const amp = canvas.height / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0366d6';
        
        for (let i = 0; i < canvas.width; i++) {
            let min = 1.0, max = -1.0;
            for (let j = 0; j < step; j++) {
                const datum = data[(i * step) + j];
                if (datum < min) min = datum;
                if (datum > max) max = datum;
            }
            ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
        }
    }

    /* 
        ========================================
        MARKER DRAG LOGIC (WITH PLAY-ON-RELEASE)
        ========================================
    */
    function handleDrag(id, key) {
        const el = document.getElementById(id);
        let active = false;
        
        const startDrag = (e) => { 
            active = true; 
            e.preventDefault(); 
        };
        
        const doDrag = (e) => {
            if (!active) return;
            const rect = document.getElementById('display-screen').getBoundingClientRect();
            // Support both touch and mouse events
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const x = clientX - rect.left;
            let pct = Math.max(0, Math.min(1, x / rect.width));
            markers[key] = pct;
            el.style.left = (pct * 100) + '%';
        };

        const endDrag = () => { 
            if (active) {
                active = false; 
                // Auto-trigger playback on release if a recording exists
                if (audioBuffer) {
                    if (key === 'intro') {
                        startPlayback('intro');
                    } else {
                        startPlayback('start');
                    }
                }
            }
        };

        el.addEventListener('touchstart', startDrag);
        el.addEventListener('mousedown', startDrag);
        
        window.addEventListener('touchmove', doDrag);
        window.addEventListener('mousemove', doDrag);
        
        window.addEventListener('touchend', endDrag);
        window.addEventListener('mouseup', endDrag);
    }
    
    handleDrag('intro-marker', 'intro');
    handleDrag('start-marker', 'start');
    handleDrag('end-marker', 'end');

    /* 
        ========================================
        RECORDING LOGIC
        ========================================
    */
    recBtn.addEventListener('click', () => {
        if (hasRecorded) {
            location.reload();
            return;
        }
        if (!isMicActive) {
            alert("Please tap INITIALIZE MIC first.");
            return;
        }
        if (!isRecording) startRec();
        else stopRec();
    });

    function startRec() {
        stopPlayback();
        audioBuffer = null;
        liveAmplitudes = [];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        playhead.style.display = 'none';
        
        isRecording = true;
        recBtn.innerText = "STOP REC";
        recBtn.classList.add('rec-active');
        audioChunks = [];
        startTime = Date.now();
        
        recorder = new MediaRecorder(micStream);
        recorder.ondataavailable = e => audioChunks.push(e.data);
        recorder.start();

        drawLiveWaveform();

        timerInterval = setInterval(() => {
            let ms = Date.now() - startTime;
            let sec = Math.floor(ms / 1000);
            timerDisplay.innerText = "00:" + sec.toString().padStart(2, '0');
            if (sec >= MAX_REC_SECONDS) stopRec();
        }, 100);
    }

    function stopRec() {
        isRecording = false;
        hasRecorded = true;
        clearInterval(timerInterval);
        
        recBtn.innerText = "RESET TO RECORD";
        recBtn.classList.remove('rec-active');
        recBtn.style.background = "#24292e";
        recBtn.style.color = "#ffffff";
        recBtn.style.borderColor = "#24292e";
        recBtn.style.boxShadow = "none";
        
        recorder.stop();
        
        recorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/wav' });
            const arr = await blob.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arr);
            cancelAnimationFrame(animationId);
            drawStaticWaveform();
        };
    }

    /* 
        ========================================
        PLAYBACK & PLAYHEAD LOGIC
        ========================================
    */
    function startPlayback(startKey) {
        if (!audioBuffer) return;
        stopPlayback();
        
        isPlaying = true;
        playhead.style.display = 'block';
        
        sourceNode = audioCtx.createBufferSource();
        sourceNode.buffer = audioBuffer;
        
        bufferOffset = audioBuffer.duration * markers[startKey];
        const loopStart = audioBuffer.duration * markers.start;
        const loopEnd = audioBuffer.duration * markers.end;

        sourceNode.loop = true;
        sourceNode.loopStart = loopStart;
        sourceNode.loopEnd = loopEnd;
        sourceNode.playbackRate.value = pitchSlider.value;

        sourceNode.connect(highPassNode);
        
        playbackStartTime = audioCtx.currentTime;
        sourceNode.start(0, bufferOffset);
        
        updatePlayhead();
    }

    function stopPlayback() {
        isPlaying = false;
        if (sourceNode) {
            try { sourceNode.stop(); } catch(e) {}
            try { sourceNode.disconnect(); } catch(e) {}
            sourceNode = null;
        }
        cancelAnimationFrame(playheadAnimId);
        playhead.style.display = 'none';
    }

    function updatePlayhead() {
        if (!isPlaying || !audioBuffer) return;
        
        let pitchRate = pitchSlider.value;
        let playedTime = (audioCtx.currentTime - playbackStartTime) * pitchRate;
        let currentPos = bufferOffset + playedTime;
        
        let loopStartSec = markers.start * audioBuffer.duration;
        let loopEndSec = markers.end * audioBuffer.duration;
        
        if (currentPos > loopEndSec) {
            currentPos = loopStartSec + ((currentPos - loopEndSec) % (loopEndSec - loopStartSec));
        }
        
        let pct = currentPos / audioBuffer.duration;
        playhead.style.left = (pct * 100) + '%';
        
        playheadAnimId = requestAnimationFrame(updatePlayhead);
    }

    // Button event listeners
    document.getElementById('play-intro-btn').addEventListener('click', () => startPlayback('intro'));
    document.getElementById('play-loop-btn').addEventListener('click', () => startPlayback('start'));
    document.getElementById('stop-btn').addEventListener('click', stopPlayback);
    document.getElementById('reset-btn').addEventListener('click', () => location.reload());
</script>

</body>
</html>
