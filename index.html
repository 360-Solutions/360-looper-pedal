<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Looper Pedal v0.006</title>
    <style>
        body {
            background-color: #24292e;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #e1e4e8;
        }

        #pedal-case {
            width: 340px;
            background-color: #d1d5da;
            border: 3px solid #444;
            border-radius: 30px;
            padding: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 15px 0 #959da5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .brand-label {
            font-size: 18px;
            font-weight: 200;
            color: #24292e;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        #waveform-container {
            width: 100%;
            height: 150px;
            background: #24292e;
            border: 2px solid #444;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            cursor: ew-resize;
            z-index: 5;
        }

        #start-marker { background: #0366d6; left: 10%; }
        #end-marker { background: #d73a49; right: 10%; }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .pedal-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #24292e;
            background: #ffffff;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #24292e;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 0 #959da5;
        }

        .pedal-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #959da5;
        }

        .rec-active {
            background: #d73a49 !important;
            color: white !important;
        }

        .play-active {
            background: #28a745 !important;
            color: white !important;
        }

        .slider-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            background: #fafbfc;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #959da5;
        }

        label {
            font-size: 10px;
            color: #586069;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        #timer {
            font-family: monospace;
            font-size: 20px;
            color: #24292e;
            background: #fff;
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid #959da5;
        }
    </style>
</head>
<body>

<div id="pedal-case">
    <div class="brand-label">360 LOOPER v0.006</div>
    
    <div id="timer">00:00</div>

    <div id="waveform-container">
        <canvas id="waveform-canvas"></canvas>
        <div id="start-marker" class="marker"></div>
        <div id="end-marker" class="marker"></div>
    </div>

    <div class="controls">
        <button id="rec-btn" class="pedal-btn">RECORD</button>
        <button id="play-btn" class="pedal-btn">PLAY LOOP</button>
    </div>

    <div class="slider-group">
        <label>Loop Volume</label>
        <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="0.8">
    </div>

    <button id="reset-btn" class="pedal-btn" style="color: #d73a49; font-size: 10px; padding: 5px;">RESET ALL</button>
</div>

<script>
    let audioCtx;
    let micStream;
    let recorder;
    let audioChunks = [];
    let audioBuffer;
    let sourceNode;
    let isRecording = false;
    let isPlaying = false;
    let startTime;
    let timerInterval;

    const canvas = document.getElementById('waveform-canvas');
    const ctx = canvas.getContext('2d');
    const recBtn = document.getElementById('rec-btn');
    const playBtn = document.getElementById('play-btn');
    const startMarker = document.getElementById('start-marker');
    const endMarker = document.getElementById('end-marker');
    const timerDisplay = document.getElementById('timer');

    let loopStartPct = 0.1;
    let loopEndPct = 0.9;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // Resize canvas for high resolution
    function resizeCanvas() {
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = canvas.offsetHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Marker Dragging Logic
    function setupMarker(marker, isStart) {
        let isDragging = false;
        marker.addEventListener('touchstart', (e) => { isDragging = true; e.preventDefault(); });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            let rect = document.getElementById('waveform-container').getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            let pct = Math.max(0, Math.min(1, x / rect.width));
            
            if (isStart) {
                loopStartPct = Math.min(pct, loopEndPct - 0.05);
                marker.style.left = (loopStartPct * 100) + '%';
            } else {
                loopEndPct = Math.max(pct, loopStartPct + 0.05);
                marker.style.left = (loopEndPct * 100) + '%';
            }
        });
        window.addEventListener('touchend', () => { isDragging = false; });
    }

    setupMarker(startMarker, true);
    setupMarker(endMarker, false);

    recBtn.addEventListener('click', async () => {
        initAudio();
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    });

    async function startRecording() {
        isRecording = true;
        recBtn.innerText = "STOP";
        recBtn.classList.add('rec-active');
        audioChunks = [];
        startTime = Date.now();
        
        timerInterval = setInterval(() => {
            let sec = Math.floor((Date.now() - startTime) / 1000);
            timerDisplay.innerText = "00:" + sec.toString().padStart(2, '0');
            if (sec >= 60) stopRecording();
        }, 100);

        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(micStream);
        recorder.ondataavailable = e => audioChunks.push(e.data);
        recorder.start();
    }

    async function stopRecording() {
        isRecording = false;
        clearInterval(timerInterval);
        recBtn.innerText = "RECORD";
        recBtn.classList.remove('rec-active');
        
        recorder.stop();
        micStream.getTracks().forEach(t => t.stop()); // Kill mic immediately

        recorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type: 'audio/wav' });
            const arrayBuffer = await blob.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            drawWaveform(audioBuffer);
        };
    }

    function drawWaveform(buffer) {
        const data = buffer.getChannelData(0);
        const step = Math.ceil(data.length / canvas.width);
        const amp = canvas.height / 2;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0366d6';
        
        for (let i = 0; i < canvas.width; i++) {
            let min = 1.0;
            let max = -1.0;
            for (let j = 0; j < step; j++) {
                const datum = data[(i * step) + j];
                if (datum < min) min = datum;
                if (datum > max) max = datum;
            }
            ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
        }
    }

    playBtn.addEventListener('click', () => {
        if (!audioBuffer) return;
        if (isPlaying) {
            stopPlayback();
        } else {
            startPlayback();
        }
    });

    function startPlayback() {
        isPlaying = true;
        playBtn.innerText = "STOP";
        playBtn.classList.add('play-active');

        sourceNode = audioCtx.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.loop = true;
        
        const start = audioBuffer.duration * loopStartPct;
        const end = audioBuffer.duration * loopEndPct;
        sourceNode.loopStart = start;
        sourceNode.loopEnd = end;

        const gainNode = audioCtx.createGain();
        gainNode.gain.value = document.getElementById('vol-slider').value;
        
        sourceNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        sourceNode.start(0, start);
    }

    function stopPlayback() {
        isPlaying = false;
        playBtn.innerText = "PLAY LOOP";
        playBtn.classList.remove('play-active');
        if (sourceNode) sourceNode.stop();
    }

    document.getElementById('reset-btn').addEventListener('click', () => {
        location.reload();
    });
</script>

</body>
</html>
